name: Latest Craft

# Proves the plugin installs next to the newest stable Craft release (#78).
# On composer.json changes, because a constraint we raise can lock out the
# newest Craft; and weekly, because Craft can lock us out without any change
# here, as 5.12.0 did by pinning mcp/sdk 0.8.1 four days after 1.8.0 shipped.
# GitHub emails a scheduled failure to whoever last edited this file's cron.

on:
  push:
    branches: [main, master]
    paths: [composer.json, .github/scripts/latest-craft.php, .github/workflows/latest-craft.yml]
  pull_request:
    branches: [main, master]
    paths: [composer.json, .github/scripts/latest-craft.php, .github/workflows/latest-craft.yml]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: latest-craft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Installs on the latest Craft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # A dry run resolves metadata only and downloads no packages, so there is
      # nothing worth caching.
      - name: Resolve against the newest stable Craft
        run: php .github/scripts/latest-craft.php
